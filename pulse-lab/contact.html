<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Book a Session | Pulse Lab</title>

    <meta name="description"
        content="Book a recording, mixing, or beat production session with Pulse Lab. Tell us about your project and preferred date.">
    <meta name="author" content="Jason Ntuuwa">
    <meta property="og:title" content="Book a Session | Pulse Lab">
    <meta property="og:description" content="Book a studio session for beats, mixing, or mastering.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jasonntuuwa.github.io/wdd231/pulse-lab/contact.html">
    <meta property="og:image" content="https://jasonntuuwa.github.io/wdd231/pulse-lab/images/og-image.png">

    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script type="module" src="scripts/main.mjs"></script>
</head>

<body>
    <header>
        <a class="logo" href="index.html">Pulse<span>Lab</span></a>
        <!-- Hamburger button: visible on small screens only -->
        <button id="menu-button" aria-expanded="false" aria-controls="site-nav"
            aria-label="Toggle navigation menu">&#9776;</button>
        <nav id="site-nav" aria-label="Main navigation">
            <ul>
                <!-- aria-current="page" marks the active page (wayfinding); move it per page -->
                <li><a href="index.html">Home</a></li>
                <li><a href="beats.html">Beats</a></li>
                <li><a href="contact.html" aria-current="page">Book a Session</a></li>
            </ul>
        </nav>
    </header>

    <main>
            <h1>Book a Session</h1>
            <p>Tell us about your project and we will follow up within two business days.</p>
        
            
            <form action="thanks.html" method="get" class="booking-form">
                <div>
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" required autocomplete="given-name">
                </div>
                <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" required autocomplete="family-name">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div>
                    <label for="phone">Phone (optional)</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="[0-9+()\- ]{7,}"
                        title="Use digits, spaces, and + ( ) - only, at least 7 characters">
                </div>
                <div>
                    <label for="service">Service</label>
                    <select id="service" name="service" required>
                        <option value="">Select a service</option>
                        <option value="custom-beat">Custom Beat Production</option>
                        <option value="mixing">Mixing</option>
                        <option value="mastering">Mastering</option>
                        <option value="recording">Recording Session</option>
                    </select>
                </div>
                <div>
                    <label for="session-date">Preferred Date</label>
                    <input type="date" id="session-date" name="session-date" required>
                </div>
                <div class="full">
                    <label for="details">Project Details</label>
                    <textarea id="details" name="details" rows="5" required minlength="10"
                        placeholder="Genre, reference tracks, deadline..."></textarea>
                </div>
                <div class="full checkbox-row">
                    <input type="checkbox" id="updates" name="updates" value="yes">
                    <label for="updates">Send me studio news and new beat releases</label>
                </div>
                <div class="full">
                    <button type="submit" class="button">Send Request</button>
                </div>
            </form>
        </main>

    <footer>
        <p>&copy; <span id="year"></span> Pulse Lab | Jason Ntuuwa | Hopkins, MN</p>
        <p>
            <a href="attributions.html">Attributions</a> |
            <a href="https://www.youtube.com/" target="_blank" rel="noopener">Video Demo</a>
        </p>
        <p>Last modified: <span id="last-modified"></span></p>
    </footer>
</body>

</html>
